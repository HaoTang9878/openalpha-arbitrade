services:
  arbitrage:
    build: .
    container_name: openalpha-arbitrage
    restart: unless-stopped
    ports:
      - "127.0.0.1:8070:8070"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    mem_limit: 640m
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8070/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
